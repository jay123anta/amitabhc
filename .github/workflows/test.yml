name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          node --check interpreter.js
          node --check birthday.js
          node --check bin/amitabhc.js
          node --check tests/run_tests.js
          node --check tests/birthday.test.js
      - name: Run test suite
        run: node tests/run_tests.js
      - name: Run Janamdin tests
        run: node tests/birthday.test.js
      - name: Run all examples (non-interactive smoke test)
        run: |
          for f in examples/*.amitabhc; do
            echo "--- $f"
            yes 7 | timeout 30 node bin/amitabhc.js run "$f" > /dev/null || exit 1
          done